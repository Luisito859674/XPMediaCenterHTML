<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>XP Media Center - HTML Recreation</title>
</head>
<body>
  <div class="topbar">
    <div class="left-controls">
      <div class="power">⏻</div>
      <div id="clock">10:20 PM</div>
    </div>
    <div class="logo">
      <img src="logo.svg" alt="Media Center logo" class="logo-img">
      <div class="logo-text">Media<span class="bold">Center</span></div>
    </div>
  </div>

  <div class="watermark">start</div>

  <main class="menu-wrap" role="application">
    <div class="selector" id="selector" aria-hidden="true"></div>
    <ul class="menu" role="menu" id="menu">
      <li class="menu-item" data-index="0" role="menuitem">Online Spotlight</li>
      <li class="menu-item" data-index="1" role="menuitem">My Videos</li>
      <li class="menu-item selected" data-index="2" role="menuitem">My Pictures</li>
      <li class="menu-item" data-index="3" role="menuitem">My Music</li>
      <li class="menu-item" data-index="4" role="menuitem">More Programs</li>
    </ul>
    <div class="panels">
      <section class="panel" id="panel-0" data-index="0" hidden></section>
      <section class="panel" id="panel-1" data-index="1" hidden>
        <div class="videos-layout">
          <div class="videos-left">
            <h2 class="panel-title">MY VIDEOS</h2>
            <div class="sort-box">
              <div class="sort-option"><span class="label">Sort by Name</span><span class="dot selected"></span></div>
              <div class="sort-option"><span class="label">Sort by Date</span><span class="dot"></span></div>
            </div>
          </div>
          <div class="videos-main">
            <p class="empty-msg">No videos were found. Either there are no videos, or you are viewing an empty folder.</p>
            <div class="videos-list" hidden></div>
          </div>
        </div>

        <div class="tray">
          <div class="thumb">
            <div class="thumb-art"></div>
            <div class="thumb-time">00:00</div>
          </div>
        </div>

        <div class="modal" id="addVideosModal" hidden>
          <div class="modal-content">
            <h3>ADD VIDEOS</h3>
            <p>Do you want to add videos now?</p>
            <label class="dontask"><input type="checkbox" id="dontAsk"> Don't ask me this again</label>
            <div class="modal-actions">
              <button id="addYes" class="btn green">Yes</button>
              <button id="addNo" class="btn">No</button>
            </div>
          </div>
        </div>
      </section>
      <section class="panel" id="panel-2" data-index="2" hidden></section>
      <section class="panel" id="panel-3" data-index="3" hidden></section>
      <section class="panel" id="panel-4" data-index="4" hidden></section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
